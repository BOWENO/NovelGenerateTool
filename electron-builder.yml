appId: local.novelgeneratetool.app
productName: NovelGenerateTool
directories:
  output: release
files:
  - out/**
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: NOTICE.md
    to: SOURCE-NOTICE.md
  - from: resources/preset-libraries
    to: preset-libraries
    filter:
      - "**/*"
win:
  target: nsis
  icon: build/icon.ico
linux:
  target: dir
  icon: build/icon.png
  category: Office
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: NovelGenerateTool
electronLanguages:
  - zh-CN
